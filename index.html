<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video.mp4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif}
body{display:flex;justify-content:center}
.page{width:100%;max-width:720px;min-height:100vh;background:#080808}
.header{height:58px;background:#101010;display:flex;align-items:center;padding:0 18px;gap:15px;font-size:18px}
.back{font-size:30px}
.file{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video{width:100%;aspect-ratio:16/9;background:#050505;position:relative;display:flex;align-items:center;justify-content:center}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505}
.spinner{width:48px;height:48px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
.loading-text{margin-top:16px;color:#aaa;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.play{width:62px;height:62px;border:3px solid #aaa;border-radius:50%;background:transparent;color:#fff;font-size:30px}
.controls{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#111);padding:35px 12px 10px}
.progress{height:4px;background:#aaa}
.row{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px}
.grow{flex:1}
.error{display:none;position:absolute;inset:0;background:#050505;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:auto}
.errorbox{width:100%;max-width:650px}
.warning{width:62px;height:62px;border:3px solid #ff4655;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ff4655;font-size:36px;font-weight:bold;margin:0 auto 14px}
.error h1{font-size:clamp(19px,4.5vw,30px);line-height:1.25;font-weight:400;margin:0 auto 13px;max-width:600px}
.error p{font-size:clamp(13px,3.5vw,17px);line-height:1.55;color:#aaa;margin:0 auto;max-width:520px}
.ok{margin-top:19px;padding:9px 30px;border:1px solid #888;border-radius:5px;background:transparent;color:#fff;font-size:15px}
.note{text-align:center;color:#555;font-size:11px;padding:14px}
</style>
</head>
<body>
<div class="page">
<div class="header">
<span class="back">‹</span>
<span class="file">Video.mp4</span>
<span>⋮</span>
</div>

<div class="video">

<div class="loading" id="loading">
<div class="spinner"></div>
<div class="loading-text">Buffering...</div>
</div>

<button class="play" id="play">▶</button>

<div class="controls" id="controls">
<div class="progress"></div>
<div class="row">
<span>▶</span><span>🔊</span><span>0:00 / 5:27</span>
<span class="grow"></span><span>⚙</span><span>⛶</span>
</div>
</div>

<div class="error" id="error">
<div class="errorbox">
<div class="warning">!</div>
<h1>This video has been deleted by community violence.</h1>
<p>This video is no longer available due to a violation of our community guidelines.</p>
<button class="ok" onclick="location.reload()">OK</button>
</div>
</div>

</div>
<div class="note">Video player</div>
</div>

<script>
window.onload=function(){
setTimeout(function(){
document.getElementById("loading").style.display="none";
document.getElementById("play").style.display="none";
document.getElementById("controls").style.display="none";
document.getElementById("error").style.display="flex";
},4000);
};
</script>
</body>
</html>
